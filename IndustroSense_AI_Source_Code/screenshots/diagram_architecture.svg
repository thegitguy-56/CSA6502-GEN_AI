<svg width="1000" height="560" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="560" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">IndustroSense AI - System Architecture</text>

<!-- User -->
<rect x="420" y="50" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="500" y="75" text-anchor="middle" font-size="13" fill="#2C2C2A">Field engineer / technician</text>
<line x1="500" y1="90" x2="500" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Web front end -->
<rect x="340" y="120" width="320" height="55" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="500" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">Streamlit / Gradio web front end</text>
<text x="500" y="160" text-anchor="middle" font-size="11" fill="#185FA5">Query, image upload, voice-note upload; show sources/trace toggle</text>
<line x1="500" y1="175" x2="500" y2="205" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- FastAPI backend -->
<rect x="300" y="205" width="400" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="500" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">Backend API layer (FastAPI)</text>
<text x="500" y="244" text-anchor="middle" font-size="11" fill="#534AB7">Input validation - rate limiting - auth/access control</text>

<line x1="500" y1="255" x2="500" y2="280" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Three module row -->
<rect x="60" y="280" width="270" height="150" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="195" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">1. Knowledge Retrieval &amp; Agent</text>
<text x="195" y="322" text-anchor="middle" font-size="11" fill="#0F6E56">Chunking -&gt; TF-IDF/SVD embed</text>
<text x="195" y="338" text-anchor="middle" font-size="11" fill="#0F6E56">-&gt; FAISS vector index</text>
<text x="195" y="358" text-anchor="middle" font-size="11" fill="#0F6E56">ReAct-style agent router:</text>
<text x="195" y="374" text-anchor="middle" font-size="11" fill="#0F6E56">retrieve_tool / schedule_tool</text>
<text x="195" y="394" text-anchor="middle" font-size="11" fill="#0F6E56">/ ask clarifying question</text>
<text x="195" y="413" text-anchor="middle" font-size="10" fill="#0F6E56">Corpus: manuals, SOPs, logs</text>

<rect x="365" y="280" width="270" height="150" rx="10" fill="#FAECE7" stroke="#993C1D"/>
<text x="500" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">2. Multimodal Understanding</text>
<text x="500" y="322" text-anchor="middle" font-size="11" fill="#993C1D">Text query (as typed)</text>
<text x="500" y="341" text-anchor="middle" font-size="11" fill="#993C1D">Image -&gt; VLM caption</text>
<text x="500" y="360" text-anchor="middle" font-size="11" fill="#993C1D">Voice note -&gt; ASR transcript</text>
<text x="500" y="384" text-anchor="middle" font-size="11" fill="#993C1D">Late fusion -&gt; consolidated</text>
<text x="500" y="400" text-anchor="middle" font-size="11" fill="#993C1D">diagnostic context + confidence</text>

<rect x="670" y="280" width="270" height="150" rx="10" fill="#FBEAF0" stroke="#993556"/>
<text x="805" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#72243E">3. Responsible Deployment</text>
<text x="805" y="322" text-anchor="middle" font-size="11" fill="#993556">Confidence / uncertainty flag</text>
<text x="805" y="341" text-anchor="middle" font-size="11" fill="#993556">Human-review escalation</text>
<text x="805" y="360" text-anchor="middle" font-size="11" fill="#993556">Audit log (prompt, sources,</text>
<text x="805" y="376" text-anchor="middle" font-size="11" fill="#993556">response, timestamp)</text>
<text x="805" y="396" text-anchor="middle" font-size="11" fill="#993556">Model card + governance policy</text>

<!-- connecting lines from backend to 3 modules -->
<line x1="330" y1="255" x2="195" y2="280" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="500" y1="255" x2="500" y2="280" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="670" y1="255" x2="805" y2="280" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<!-- cross links between module 1 and 2 -->
<line x1="330" y1="355" x2="365" y2="355" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="347" y="348" text-anchor="middle" font-size="9" fill="#5F5E5A">retrieved chunks</text>

<!-- output -->
<line x1="500" y1="430" x2="500" y2="460" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300" y="460" width="400" height="55" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="500" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#27500A">Grounded diagnostic response</text>
<text x="500" y="499" text-anchor="middle" font-size="11" fill="#3B6D11">Citations - confidence badge - "AI-generated, review if flagged"</text>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>

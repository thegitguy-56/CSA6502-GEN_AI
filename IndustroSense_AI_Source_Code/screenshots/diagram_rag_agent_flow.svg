<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="480" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">RAG Pipeline and Agent Decision Flow</text>

<!-- corpus -->
<rect x="30" y="60" width="150" height="50" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="105" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">Corpus (5 docs)</text>
<text x="105" y="97" text-anchor="middle" font-size="10" fill="#444441">manuals/SOPs/logs</text>

<line x1="180" y1="85" x2="230" y2="85" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="230" y="60" width="150" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="305" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Chunker</text>
<text x="305" y="97" text-anchor="middle" font-size="10" fill="#0F6E56">60 words, 15 overlap</text>

<line x1="380" y1="85" x2="430" y2="85" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="430" y="60" width="170" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="515" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">TF-IDF + SVD embed</text>
<text x="515" y="97" text-anchor="middle" font-size="10" fill="#0F6E56">128-dim dense vector</text>

<line x1="600" y1="85" x2="650" y2="85" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="650" y="60" width="150" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="725" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">FAISS index</text>
<text x="725" y="97" text-anchor="middle" font-size="10" fill="#0F6E56">IndexFlatIP (cosine)</text>

<!-- query path -->
<rect x="30" y="170" width="150" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="105" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">User query</text>
<text x="105" y="207" text-anchor="middle" font-size="10" fill="#185FA5">text / multimodal</text>

<line x1="105" y1="220" x2="105" y2="255" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<polygon points="105,255 205,290 105,325 5,290" fill="#EEEDFE" stroke="#534AB7"/>
<text x="105" y="285" text-anchor="middle" font-size="10" fill="#3C3489">Schedule</text>
<text x="105" y="298" text-anchor="middle" font-size="10" fill="#3C3489">keywords?</text>

<!-- No branch -> retrieve tool -->
<line x1="205" y1="290" x2="260" y2="290" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="230" y="282" text-anchor="middle" font-size="9" fill="#5F5E5A">no</text>
<rect x="260" y="265" width="170" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="345" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">retrieve_tool(query,k=3)</text>
<text x="345" y="302" text-anchor="middle" font-size="10" fill="#0F6E56">search FAISS index</text>

<line x1="430" y1="290" x2="480" y2="290" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="480" y="265" width="200" height="50" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="580" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">Augmented prompt</text>
<text x="580" y="302" text-anchor="middle" font-size="10" fill="#993C1D">top-k chunks + query -&gt; LLM</text>

<!-- Yes branch -> schedule tool -->
<line x1="105" y1="325" x2="105" y2="365" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="118" y="350" font-size="9" fill="#5F5E5A">yes</text>
<rect x="15" y="365" width="220" height="60" rx="8" fill="#FBEAF0" stroke="#993556"/>
<text x="125" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#72243E">schedule_tool(component,</text>
<text x="125" y="400" text-anchor="middle" font-size="11" fill="#72243E">last_hrs, current_hrs)</text>
<text x="125" y="416" text-anchor="middle" font-size="10" fill="#993556">-&gt; DUE / OVERDUE / OK</text>

<line x1="235" y1="395" x2="270" y2="395" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<polygon points="270,370 350,395 270,420 190,395" fill="#EEEDFE" stroke="#534AB7" opacity="0"/>
<rect x="270" y="368" width="180" height="55" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="360" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">Numeric fields present?</text>
<text x="360" y="405" text-anchor="middle" font-size="10" fill="#854F0B">component + hours parsed</text>
<text x="360" y="418" text-anchor="middle" font-size="9" fill="#854F0B">else -&gt; clarifying question</text>

<line x1="450" y1="395" x2="480" y2="395" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="480" y="368" width="200" height="55" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="580" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#27500A">Schedule result +</text>
<text x="580" y="405" text-anchor="middle" font-size="11" fill="#3B6D11">supporting retrieved refs</text>

<!-- connect index to retrieve tool box -->
<line x1="725" y1="110" x2="725" y2="140" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="725" y1="140" x2="345" y2="140" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="345" y1="140" x2="345" y2="265" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#a)"/>
<text x="530" y="132" text-anchor="middle" font-size="9" fill="#5F5E5A">index used by both branches</text>

<!-- final response -->
<line x1="580" y1="315" x2="580" y2="345" stroke="#5F5E5A" stroke-width="1.2"/>
<line x1="580" y1="423" x2="580" y2="345" stroke="#5F5E5A" stroke-width="1.2"/>
<line x1="580" y1="345" x2="580" y2="345" stroke="none"/>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>

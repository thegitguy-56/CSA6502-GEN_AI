<svg width="1080" height="420" viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="1080" height="420" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Responsible Web Deployment - Security &amp; Governance Layer</text>

<rect x="40" y="55" width="130" height="45" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="105" y="82" text-anchor="middle" font-size="12" fill="#2C2C2A">Technician (client)</text>
<line x1="170" y1="77" x2="220" y2="77" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="195" y="68" text-anchor="middle" font-size="9" fill="#5F5E5A">HTTPS</text>

<rect x="220" y="55" width="180" height="45" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="310" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">Streamlit UI</text>
<text x="310" y="88" text-anchor="middle" font-size="10" fill="#185FA5">auth session token</text>

<line x1="400" y1="77" x2="450" y2="77" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="450" y="55" width="500" height="45" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="700" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">FastAPI backend - input validation, prompt-injection filter, rate limiter (N req/window)</text>
<text x="700" y="88" text-anchor="middle" font-size="10" fill="#534AB7">rejects: empty/oversized text, disallowed file ext/size, blocked patterns</text>

<line x1="700" y1="100" x2="700" y2="140" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>

<rect x="450" y="140" width="230" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="565" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Model inference layer</text>
<text x="565" y="180" text-anchor="middle" font-size="10" fill="#0F6E56">RAG + agent + fusion</text>
<text x="565" y="193" text-anchor="middle" font-size="10" fill="#0F6E56">confidence score computed</text>

<line x1="565" y1="200" x2="565" y2="235" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<polygon points="565,235 645,270 565,305 485,270" fill="#FAEEDA" stroke="#854F0B"/>
<text x="565" y="265" text-anchor="middle" font-size="10" fill="#633806">confidence</text>
<text x="565" y="278" text-anchor="middle" font-size="10" fill="#633806">&lt; 0.60 ?</text>

<line x1="645" y1="270" x2="700" y2="270" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="672" y="262" text-anchor="middle" font-size="9" fill="#5F5E5A">yes</text>
<rect x="700" y="245" width="270" height="50" rx="8" fill="#FBEAF0" stroke="#993556"/>
<text x="835" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#72243E">Human-in-the-loop review</text>
<text x="835" y="282" text-anchor="middle" font-size="9" fill="#993556">"AI-generated - requires review"</text>

<line x1="565" y1="305" x2="565" y2="335" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#a)"/>
<text x="580" y="322" font-size="9" fill="#5F5E5A">no</text>
<rect x="440" y="335" width="250" height="45" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="565" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#27500A">Response delivered to technician</text>

<!-- audit log branch -->
<line x1="700" y1="163" x2="880" y2="163" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="880" y="140" width="100" height="60" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="930" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#712B13">Audit log</text>
<text x="930" y="179" text-anchor="middle" font-size="9" fill="#993C1D">prompt+sources</text>
<text x="930" y="191" text-anchor="middle" font-size="9" fill="#993C1D">+response+time</text>

<rect x="880" y="230" width="100" height="60" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="930" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#712B13">Model card</text>
<text x="930" y="269" text-anchor="middle" font-size="9" fill="#993C1D">capabilities /</text>
<text x="930" y="281" text-anchor="middle" font-size="9" fill="#993C1D">limitations</text>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
</svg>
